<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products</title>
</head>
<body>

    <h1>Products</h1>

    {% if products %}

        {% for product in products %}

            <div>
                <h2>{{ product['name'] }}</h2>

                <p>
                    ID: {{ product['id'] }}
                </p>

                <p>
                    Category: {{ product['category'] }}
                </p>

                <p>
                    Price: {{ product['price'] }}
                </p>
            </div>

            <hr>

        {% endfor %}

    {% else %}

        <p>No products found.</p>

    {% endif %}

</body>
</html>
